name: Build One UI 9 Port for Galaxy A04

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Build target (system | vendor | product | kernel | all)'
        required: true
        default: 'all'

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout main port repo
        uses: actions/checkout@v4
        with:
          path: port_repo

      - name: Install build tools
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            git bc bison flex libssl-dev make libc6-dev libncurses5-dev \
            binutils-aarch64-linux-gnu erofs-utils android-sdk-libsparse-utils \
            cpio zip unzip curl wget xz-utils

      - name: Checkout Galaxy A04 trees
        run: |
          set -e
          mkdir -p ~/a04_trees
          git clone --depth=1 https://github.com/A04-Trees-and-ROMs/android_device_samsung_a04.git ~/a04_trees/device
          git clone --depth=1 https://github.com/A04-Trees-and-ROMs/android_vendor_samsung_a04.git ~/a04_trees/vendor
          git clone --depth=1 https://github.com/A04-Trees-and-ROMs/android_kernel_samsung_a04.git ~/a04_trees/kernel

      - name: Download GCC & Clang Toolchain
        run: |
          set -e
          mkdir -p ~/a04_trees/toolchain/gcc ~/a04_trees/toolchain/clang/host/linux-x86/clang-r383902

          cd ~/a04_trees/toolchain/gcc
          wget -q --show-progress --retry-connrefused --waitretry=2 --read-timeout=30 -t 5 \
            https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz -O gcc.tar.xz || \
            wget -q --show-progress https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz -O gcc.tar.xz
          tar -xf gcc.tar.xz -C ./

          cd ~/a04_trees/toolchain/clang
          wget -q --show-progress https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/clang-r383902.tar.gz -O clang.tar.gz
          tar -xzf clang.tar.gz -C host/linux-x86/clang-r383902

          if [ ! -x "host/linux-x86/clang-r383902/bin/clang" ] && [ -d "host/linux-x86/clang-r383902/clang-r383902/bin" ]; then
            mv host/linux-x86/clang-r383902/clang-r383902/* host/linux-x86/clang-r383902/
          fi

          find ~/a04_trees/toolchain/clang -maxdepth 5 -name "clang" -type f

      - name: Prepare workspace & configs
        run: |
          set -e
          mkdir -p ~/work/out ~/work/sys17/system ~/work/sys17/config ~/work/vendor_src
          if [ -d ~/a04_trees/vendor/proprietary/vendor ]; then
            cp -r ~/a04_trees/vendor/proprietary/vendor/* ~/work/vendor_src/
          fi

          find "$GITHUB_WORKSPACE/port_repo" -name "*system*file_contexts*" -exec cp {} ~/work/sys17/config/system_file_contexts \; 2>/dev/null || true
          find "$GITHUB_WORKSPACE/port_repo" -name "*vendor*file_contexts*" -exec cp {} ~/work/sys17/config/vendor_file_contexts \; 2>/dev/null || true

          [ -f ~/work/sys17/config/system_file_contexts ] || echo '/system(/.*)? u:object_r:system_file:s0' > ~/work/sys17/config/system_file_contexts
          [ -f ~/work/sys17/config/vendor_file_contexts ] || echo '/vendor(/.*)? u:object_r:vendor_file:s0' > ~/work/sys17/config/vendor_file_contexts

      - name: Build EROFS images (system, vendor, product)
        run: |
          set -e
          TARGET="${{ inputs.target }}"
          MKFS=$(command -v mkfs.erofs)

          build_system() {
            if [ -n "$(ls -A ~/work/sys17/system 2>/dev/null)" ]; then
              sed -i 's/\r$//' ~/work/sys17/config/system_file_contexts
              sed -i '/^\s*$/d' ~/work/sys17/config/system_file_contexts
              "$MKFS" -zlz4hc --mount-point=/system --force-uid=0 --force-gid=0 --file-contexts="$HOME/work/sys17/config/system_file_contexts" "$HOME/work/out/system_new.img" "$HOME/work/sys17/system"
            else
              echo "Skip system_new.img: ~/work/sys17/system is empty"
            fi
          }

          build_vendor() {
            if [ -n "$(ls -A ~/work/vendor_src 2>/dev/null)" ]; then
              sed -i 's/\r$//' ~/work/sys17/config/vendor_file_contexts
              sed -i '/^\s*$/d' ~/work/sys17/config/vendor_file_contexts
              "$MKFS" -zlz4hc --mount-point=/vendor --force-uid=0 --force-gid=0 --file-contexts="$HOME/work/sys17/config/vendor_file_contexts" "$HOME/work/out/vendor_new.img" "$HOME/work/vendor_src"
            else
              echo "Skip vendor_new.img: ~/work/vendor_src is empty"
            fi
          }

          build_product() {
            mkdir -p ~/work/emptyprod
            echo '/product(/.*)? u:object_r:system_file:s0' > ~/work/emptyprod_fc
            "$MKFS" -zlz4hc --mount-point=/product --force-uid=0 --force-gid=0 --file-contexts="$HOME/work/emptyprod_fc" "$HOME/work/out/product_empty.img" "$HOME/work/emptyprod"
          }

          case "$TARGET" in
            system)  build_system ;;
            vendor)  build_vendor ;;
            product) build_product ;;
            all)     build_system; build_vendor; build_product ;;
          esac

      - name: Build A04 Kernel
        run: |
          set -e
          TARGET="${{ inputs.target }}"
          if [ "$TARGET" = "kernel" ] || [ "$TARGET" = "all" ]; then
            cd ~/a04_trees/kernel
            rm -rf out
            unset HOSTAS HOSTCFLAGS KBUILD_HOSTCFLAGS

            CLANG_DIR="$HOME/a04_trees/toolchain/clang/host/linux-x86/clang-r383902/bin"
            GCC_BIN_DIR=$(find "$HOME/a04_trees/toolchain/gcc" -maxdepth 3 -type d -name "bin" | head -n 1)

            export ARCH=arm64
            export SUBARCH=arm64
            export PATH="$CLANG_DIR:${GCC_BIN_DIR}:$PATH"
            export CROSS_COMPILE=aarch64-none-linux-gnu-

            DEFCONFIG=$(ls arch/arm64/configs/*a04* 2>/dev/null | head -n 1)
            [ -z "$DEFCONFIG" ] && DEFCONFIG=$(ls arch/arm64/configs/*mt6765* 2>/dev/null | head -n 1)

            if [ -n "$DEFCONFIG" ]; then
              CFG_NAME=$(basename "$DEFCONFIG")
              echo "Using defconfig: $CFG_NAME"

              find drivers/ arch/arm64/configs/ -name "Kconfig*" -exec sed -i 's/\r$//' {} + 2>/dev/null || true
              sed -i 's/\r$//' "arch/arm64/configs/$CFG_NAME" 2>/dev/null || true

              make O=out CC="$CLANG_DIR/clang" HOSTCC="$CLANG_DIR/clang" "$CFG_NAME"
              make -j"$(nproc)" O=out CC="$CLANG_DIR/clang" HOSTCC="$CLANG_DIR/clang" LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip
              find out/arch/arm64/boot -maxdepth 1 -name "Image*" -exec cp {} ~/work/out/ \;
            else
              echo "No A04/MT6765 defconfig found automatically; inspect arch/arm64/configs"
              exit 1
            fi
          fi

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: a04-oneui9-build-${{ inputs.target }}
          path: ~/work/out/*
          if-no-files-found: warn
